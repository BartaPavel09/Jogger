spring:
  application:
    name: jogger_backend
  datasource:
    url: "jdbc:mysql://localhost:3306/jogger_db?allowPublicKeyRetrieval=true&useSSL=false"
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: THIS_IS_A_VERY_LONG_SECRET_KEY_1234567890_ABCDEF

server:
  port: 8080
